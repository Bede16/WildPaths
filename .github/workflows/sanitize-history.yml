name: Sanitize Git history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Replace and publish commit email metadata
        shell: bash
        env:
          FILTER_BRANCH_SQUELCH_WARNING: 1
        run: |
          auth_header="$(git config --local --get http.https://github.com/.extraheader)"
          git clone --mirror . ../sanitized.git
          cd ../sanitized.git
          git config http.https://github.com/.extraheader "$auth_header"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="Bede16"
            export GIT_AUTHOR_EMAIL="16863675+Bede16@users.noreply.github.com"
            export GIT_COMMITTER_NAME="Bede16"
            export GIT_COMMITTER_EMAIL="16863675+Bede16@users.noreply.github.com"
          ' -- refs/heads/main refs/tags/v1.2.1

          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin

          if git log refs/heads/main refs/tags/v1.2.1 --format='%ae%n%ce' | grep -qv '^16863675+Bede16@users.noreply.github.com$'; then
            echo "Unexpected commit email remains." >&2
            exit 1
          fi

          git push --force origin refs/heads/main:refs/heads/main
          git push --force origin refs/tags/v1.2.1:refs/tags/v1.2.1
