name: Sanitize Git history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Replace commit email metadata
        shell: bash
        run: |
          git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="Bede16"
            export GIT_AUTHOR_EMAIL="16863675+Bede16@users.noreply.github.com"
            export GIT_COMMITTER_NAME="Bede16"
            export GIT_COMMITTER_EMAIL="16863675+Bede16@users.noreply.github.com"
          ' -- --all

          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin

          if git log main v1.2.1 --format='%ae%n%ce' | grep -qv '^16863675+Bede16@users.noreply.github.com$'; then
            echo "Unexpected commit email remains." >&2
            exit 1
          fi

      - name: Publish sanitized history
        shell: bash
        run: |
          git push --force origin HEAD:main
          git push --force origin refs/tags/v1.2.1
